name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # 快反馈：代码规范 + 单元测试 + 覆盖率门槛
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 代码规范（ruff）
        run: ruff check .

      - name: 单元测试 + 覆盖率门槛
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  # 检索能力门禁：离线跑评估集，指标回退或语料变更未重新核定基线就失败
  retrieval-eval:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      # CI 里没有本地模型目录，直接用 HuggingFace 上的模型名，交给 sentence-transformers 下载
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      EMBEDDING_DEVICE: cpu
      # 重排模型不在 CI 下载（体积大、耗时）：关掉以保证评估确定性与速度。
      # 重排本身的正确性由 tests/test_reranker.py 的单元测试覆盖。
      RERANK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 缓存 HuggingFace 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-zh-v1.5

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 检索评估 + 基线校验
        run: python scripts/evaluate.py --check-baseline

      - name: 上传评估报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: eval/report.json

  # 部署门禁：确保镜像能构建、能起来、存活探针可通
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: smartkb:ci
          # 跳过体积较大的 Rerank 模型（约 1GB），缩短 CI 耗时
          build-args: |
            INSTALL_RERANK_MODEL=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试：起容器并探测存活接口
        run: |
          docker run -d --name smartkb-ci -p 8000:8000 \
            -e RERANK_ENABLED=false smartkb:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then
              echo "容器健康检查通过"
              exit 0
            fi
            sleep 2
          done
          echo "容器未能就绪，输出日志："
          docker logs smartkb-ci
          exit 1
